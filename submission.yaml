submission:
  title: "PowerGrid AI (ThreatOps) — Predictive Grid Outage & Equipment Failure Advisor" # REQUIRED
  problem_statement: > # REQUIRED
    High-voltage power transformers fail silently. Dissolved Gas Analysis (DGA) chemistry anomalies accumulate invisibly until catastrophic breakdown, and grid operators face reactive 3+ hour manual investigations across 12+ disconnected SCADA tools.
  solution_summary: > # REQUIRED
    PowerGrid AI (ThreatOps) is an AI-powered decision-support platform that ingests multi-sensor grid telemetry, diagnoses transformer DGA gas chemistry using machine learning (96.25% XGBoost accuracy across 6 fault modes with SHAP attribution and physical safety overrides), visualizes statewide Gujarat grid health across 836+ assets, and automates field crew dispatch before outages occur.
  key_features: # REQUIRED
    - "22 ML Features including 4 domain-engineered IEC 60599 Rogers Ratios & weather-compound risk features"
    - "96.25% Multi-Class XGBoost Fault Classification (DGA chemistry: C2H2, C2H4, CH4, H2, CO) & SHAP Feature Attribution"
    - "Physical Safety Override Engine enforcing 6 domain-calibrated threshold rules"
    - "Station-Level DGA Gas Inspector & Interactive Telemetry Simulation Studio with IEC 60599 Compliance Badges"
    - "Statewide Gujarat Grid GIS Map monitoring 836+ high-voltage assets across all 33 districts with MapTiler integration"
    - "Automated Field Crew Dispatching & Dynamic Zone Skill-Level Optimization"
    - "District Weather Threat Radar with 30-day historical weather telemetry and 7-day predictive forecast"
    - "Native IBM Technology Stack Integration (IBM Bob AI Assistant, watsonx.ai Granite 3.0 Engine, IBM Instana SCADA Connector)"
