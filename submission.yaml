submission:
  title: "ThreatOps — Predictive Grid Outage & Equipment Failure Advisor" # REQUIRED
  problem_statement: > # REQUIRED
    Power utility operators struggle to predict high-voltage equipment failures (such as transformer DGA gas anomalies and thermal overheating) before outages occur, leading to catastrophic blackout risks, expensive emergency repairs, and prolonged MTTR downtime.
  solution_summary: > # REQUIRED
    ThreatOps is an AI-powered decision-support platform for modern electrical grids that ingests multi-sensor telemetry, utilizes an XGBoost machine learning engine to detect insulation and transformer DGA faults with 96.25% accuracy, visualizes 836+ Gujarat grid assets on an interactive GIS map, and automates field crew dispatch before outages happen.
  key_features: # REQUIRED
    - "96.25% Multi-Class XGBoost Fault Classification (DGA chemistry, Rogers Ratios, dielectric oil)"
    - "Statewide Gujarat Grid GIS Map with 836+ assets across all 33 districts"
    - "Interactive AI Testing Studio with instant operational preset injection and SHAP attribution"
    - "Automated Field Crew Dispatch & Zone Skill-Level Optimization"
