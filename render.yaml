services:
  # ============================================================================
  # 1. ThreatOps Backend API Service (Python FastAPI)
  # ============================================================================
  - type: web
    name: threatops-api
    runtime: python
    plan: free
    region: singapore
    rootDir: src/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_gS1I7ZzXlkhF@ep-shy-cell-a8vhptd9-pooler.eastus2.azure.neon.tech/neondb?sslmode=require
      - key: PYTHON_VERSION
        value: 3.10.14

  # ============================================================================
  # 2. ThreatOps Frontend Web Dashboard (Next.js 16)
  # ============================================================================
  - type: web
    name: threatops-web
    runtime: node
    plan: free
    region: singapore
    rootDir: src/frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_MAPTILER_KEY
        value: CRFoY3RXgAloQLarTcRL
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: threatops-api
          property: url
          suffix: /api
      - key: NODE_VERSION
        value: 20.18.0
